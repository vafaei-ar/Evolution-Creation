<line x1="560" y1="126" x2="595" y2="126" stroke="#1f77b4" stroke-width="3" stroke-dasharray="8 6"/>
<text x="605" y="131" font-size="12">Chang MRCA ~ log2(N)</text>
<polyline class="line" stroke="#ff7f0e" stroke-dasharray="8 6" points="85.0,313.5 225.9,291.0 366.9,268.6 553.1,239.0 694.1,216.6 835.0,194.1"/>
