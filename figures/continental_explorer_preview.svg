<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#f8fbff"/>
    <stop offset="100%" stop-color="#eef4f7"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" x2="1">
    <stop offset="0%" stop-color="#7b2cbf"/>
    <stop offset="100%" stop-color="#d1495b"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-opacity=".12"/>
  </filter>
</defs>
<rect width="1280" height="760" fill="url(#bg)"/>
<style>
 text{font-family:Inter,Arial,sans-serif;fill:#172033}
 .card{fill:white;stroke:#dbe5ec;stroke-width:1}
 .muted{fill:#667085}
 .small{font-size:12px}
 .label{font-size:13px;font-weight:600}
 .metric{font-size:27px;font-weight:700}
 .edge{stroke:#90a4b4;stroke-width:2;opacity:.5}
 .barrier{stroke:#d00000;stroke-width:4;stroke-dasharray:8 6}
</style>

<text x="48" y="52" font-size="27" font-weight="700">Continental founder-spread explorer</text>
<text x="48" y="78" font-size="14" class="muted">Seven regions • deterministic + Monte Carlo • hard Tasmania barrier • A/B scenario comparison</text>

<!-- metric cards -->
<g filter="url(#shadow)">
 <rect class="card" x="48" y="104" width="250" height="98" rx="16"/>
 <rect class="card" x="314" y="104" width="250" height="98" rx="16"/>
 <rect class="card" x="580" y="104" width="250" height="98" rx="16"/>
 <rect class="card" x="846" y="104" width="386" height="98" rx="16"/>
</g>
<text x="68" y="132" class="small muted">Present global both-founder genealogy</text>
<text x="68" y="174" class="metric">99.9985%</text>
<text x="334" y="132" class="small muted">Present mean founder-pair DNA</text>
<text x="334" y="174" class="metric">0.000150%</text>
<text x="600" y="132" class="small muted">Present limiting region</text>
<text x="600" y="174" class="metric">Tasmania</text>
<text x="866" y="132" class="small muted">Default Tasmania outcome</text>
<text x="866" y="169" font-size="24" font-weight="700">81.5% descended from both founders</text>
<text x="866" y="190" class="small muted">Teaching defaults; not a historical estimate</text>

<!-- map card -->
<rect class="card" x="48" y="226" width="760" height="460" rx="18" filter="url(#shadow)"/>
<text x="76" y="260" font-size="17" font-weight="700">Animated regional spread</text>
<text x="76" y="282" class="small muted">Node size = modeled population • fill = both-founder fraction • lines = reproductive paths</text>

<!-- schematic land masses -->
<path d="M102 360 C142 320 204 314 238 340 C262 360 244 392 213 401 C174 413 139 397 113 377 Z" fill="#e7eee6"/>
<path d="M222 438 C260 405 294 407 318 438 C338 466 315 516 287 543 C260 562 239 527 236 488 Z" fill="#e7eee6"/>
<path d="M352 333 C390 307 437 308 465 329 C488 347 473 373 443 380 C399 388 367 369 350 350 Z" fill="#e7eee6"/>
<path d="M444 371 C500 323 604 310 677 344 C725 367 718 410 668 425 C610 443 520 429 474 400 Z" fill="#e7eee6"/>
<path d="M643 498 C684 470 730 474 752 500 C770 522 752 550 718 557 C681 564 652 544 643 519 Z" fill="#e7eee6"/>

<!-- edges -->
<line class="edge" x1="452" y1="395" x2="306" y2="452"/>
<line class="edge" x1="452" y1="395" x2="407" y2="346"/>
<line class="edge" x1="452" y1="395" x2="585" y2="376"/>
<line class="edge" x1="585" y1="376" x2="177" y2="370"/>
<line class="edge" x1="585" y1="376" x2="700" y2="518"/>
<line class="barrier" x1="700" y1="518" x2="730" y2="585"/>

<!-- nodes -->
<g>
 <circle cx="452" cy="395" r="30" fill="#7b2cbf" stroke="white" stroke-width="3"/>
 <text x="452" y="400" text-anchor="middle" fill="white" font-size="11" font-weight="700">100%</text>
 <text x="452" y="438" text-anchor="middle" class="label">Middle East</text>

 <circle cx="306" cy="452" r="34" fill="#2a9d8f" stroke="white" stroke-width="3"/>
 <text x="306" y="457" text-anchor="middle" fill="white" font-size="11" font-weight="700">100%</text>
 <text x="306" y="496" text-anchor="middle" class="label">Africa</text>

 <circle cx="407" cy="346" r="32" fill="#457b9d" stroke="white" stroke-width="3"/>
 <text x="407" y="351" text-anchor="middle" fill="white" font-size="11" font-weight="700">100%</text>
 <text x="407" y="306" text-anchor="middle" class="label">Europe</text>

 <circle cx="585" cy="376" r="43" fill="#f4a261" stroke="white" stroke-width="3"/>
 <text x="585" y="381" text-anchor="middle" fill="white" font-size="11" font-weight="700">100%</text>
 <text x="585" y="430" text-anchor="middle" class="label">Asia</text>

 <circle cx="177" cy="370" r="35" fill="#e76f51" stroke="white" stroke-width="3"/>
 <text x="177" y="375" text-anchor="middle" fill="white" font-size="11" font-weight="700">100%</text>
 <text x="177" y="417" text-anchor="middle" class="label">Americas</text>

 <circle cx="700" cy="518" r="30" fill="#264653" stroke="white" stroke-width="3"/>
 <text x="700" y="523" text-anchor="middle" fill="white" font-size="10" font-weight="700">99.98%</text>
 <text x="700" y="558" text-anchor="middle" class="label">Australia/Oceania</text>

 <circle cx="730" cy="585" r="23" fill="#d1495b" stroke="white" stroke-width="3"/>
 <text x="730" y="590" text-anchor="middle" fill="white" font-size="10" font-weight="700">81.5%</text>
 <text x="730" y="620" text-anchor="middle" class="label">Tasmania</text>
</g>
<text x="606" y="612" fill="#d00000" font-size="11" font-weight="700">hard barrier until recent contact</text>

<!-- right dashboard -->
<rect class="card" x="832" y="226" width="400" height="218" rx="18" filter="url(#shadow)"/>
<text x="860" y="260" font-size="17" font-weight="700">Uncertainty-aware result</text>
<text x="860" y="286" class="small muted">Monte Carlo mode adds finite-population lineage loss</text>
<line x1="870" y1="366" x2="1190" y2="366" stroke="#d5dde5"/>
<path d="M870 350 C920 344 957 331 1001 311 C1048 291 1105 278 1190 271 L1190 327 C1110 330 1054 337 1001 349 C950 360 912 365 870 366 Z" fill="#2d7dd2" opacity=".16"/>
<path d="M870 360 C920 352 960 339 1002 322 C1050 303 1107 294 1190 288" fill="none" stroke="#2d7dd2" stroke-width="3"/>
<text x="872" y="400" class="small muted">5–95% band</text>
<text x="966" y="400" class="small muted">median</text>
<text x="860" y="424" font-size="12">Reports P(all regions ≥50%, ≥90%, ≥99%) and lineage-extinction probability.</text>

<rect class="card" x="832" y="462" width="400" height="224" rx="18" filter="url(#shadow)"/>
<text x="860" y="496" font-size="17" font-weight="700">A/B scenario comparison</text>
<text x="860" y="520" class="small muted">Example: recent contact vs permanent Tasmania isolation</text>
<text x="860" y="558" class="label">Tasmania present both-founder fraction</text>
<rect x="860" y="576" width="286" height="25" rx="8" fill="#edf1f5"/>
<rect x="860" y="576" width="233" height="25" rx="8" fill="url(#bar)"/>
<text x="1157" y="594" class="small">81.5%</text>
<text x="860" y="630" class="label">Permanent hard barrier</text>
<rect x="860" y="646" width="286" height="25" rx="8" fill="#edf1f5"/>
<rect x="860" y="646" width="2" height="25" rx="8" fill="#d00000"/>
<text x="1157" y="664" class="small">0%</text>

<text x="48" y="725" font-size="12" class="muted">Preview uses the repository's editable teaching defaults. The late-contact parent-source rate and Tasmania start population are sensitivity assumptions, not reconstructed historical measurements.</text>
</svg>