<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#111}.axis{stroke:#333}</style>
<text x="450" y="30" text-anchor="middle" font-size="22">Domestication chronology: camel does not join the early-Neolithic cluster</text>
<line class="axis" x1="170" y1="360" x2="840" y2="360"/>
<line x1="170.0" y1="354" x2="170.0" y2="366" stroke="#555"/>
<text x="170.0" y="385" text-anchor="middle" font-size="12">14 ka</text>
<line x1="265.7" y1="354" x2="265.7" y2="366" stroke="#555"/>
<text x="265.7" y="385" text-anchor="middle" font-size="12">12 ka</text>
<line x1="361.4" y1="354" x2="361.4" y2="366" stroke="#555"/>
<text x="361.4" y="385" text-anchor="middle" font-size="12">10 ka</text>
<line x1="457.1" y1="354" x2="457.1" y2="366" stroke="#555"/>
<text x="457.1" y="385" text-anchor="middle" font-size="12">8 ka</text>
<line x1="552.9" y1="354" x2="552.9" y2="366" stroke="#555"/>
<text x="552.9" y="385" text-anchor="middle" font-size="12">6 ka</text>
<line x1="648.6" y1="354" x2="648.6" y2="366" stroke="#555"/>
<text x="648.6" y="385" text-anchor="middle" font-size="12">4 ka</text>
<line x1="744.3" y1="354" x2="744.3" y2="366" stroke="#555"/>
<text x="744.3" y="385" text-anchor="middle" font-size="12">2 ka</text>
<line x1="840.0" y1="354" x2="840.0" y2="366" stroke="#555"/>
<text x="840.0" y="385" text-anchor="middle" font-size="12">0 ka</text>
<text x="155" y="100" text-anchor="end" font-size="13">sheep</text>
<line x1="313.6" y1="95" x2="361.4" y2="95" stroke="#1f77b4" stroke-width="12"/>
<text x="155" y="165" text-anchor="end" font-size="13">goat</text>
<line x1="337.5" y1="160" x2="385.4" y2="160" stroke="#1f77b4" stroke-width="12"/>
<text x="155" y="230" text-anchor="end" font-size="13">taurine cattle</text>
<line x1="337.5" y1="225" x2="385.4" y2="225" stroke="#1f77b4" stroke-width="12"/>
<text x="155" y="295" text-anchor="end" font-size="13">dromedary camel</text>
<line x1="624.6" y1="290" x2="696.4" y2="290" stroke="#1f77b4" stroke-width="12"/>
<line x1="313.6" y1="55" x2="313.6" y2="345" stroke="#d62728" stroke-dasharray="6 5"/>
<text x="320.6" y="55" font-size="12">11 ka proposed founder date</text>
<text x="450" y="415" text-anchor="middle" font-size="11">Bars are approximate domestication intervals, not biological lineage-origin dates.</text>
</svg>