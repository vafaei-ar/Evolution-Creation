<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#111}.base{fill:#eee}</style>
<text x="450" y="30" text-anchor="middle" font-size="22">One extra generation roughly halves the required mixing threshold</text>
<rect class="base" x="220" y="107" width="570" height="32" rx="5"/>
<text x="202" y="129" text-anchor="end" font-size="13">50% fixation threshold</text>
<rect class="base" x="220" y="207" width="570" height="32" rx="5"/>
<text x="202" y="229" text-anchor="end" font-size="13">95% fixation threshold</text>
<g opacity="0">
<animate attributeName="opacity" values="1;0" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
<rect x="220" y="107" width="395.5" height="32" rx="5" fill="#1f77b4"/>
<text x="625.5" y="129" font-size="13">1.80%</text>
<rect x="220" y="207" width="505.1" height="32" rx="5" fill="#ff7f0e"/>
<text x="735.1" y="229" font-size="13">2.30%</text>
<text x="450" y="305" text-anchor="middle" font-size="17">8 generations of post-contact reproduction</text>
</g>
<g opacity="0">
<animate attributeName="opacity" values="0;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
<rect x="220" y="107" width="198.3" height="32" rx="5" fill="#1f77b4"/>
<text x="428.3" y="129" font-size="13">0.90%</text>
<rect x="220" y="207" width="253.5" height="32" rx="5" fill="#ff7f0e"/>
<text x="483.5" y="229" font-size="13">1.16%</text>
<text x="450" y="305" text-anchor="middle" font-size="17">9 generations of post-contact reproduction</text>
</g>
<text x="450" y="337" text-anchor="middle" font-size="11">Representative published population-model output N = 7,465; independence approximation.</text>
</svg>