<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#111}.grid{stroke:#ddd}.line{fill:none;stroke-width:3}</style>
<text x="450" y="30" text-anchor="middle" font-size="22">Genealogical slots grow exponentially; expected genetic ancestors do not</text>
<line class="grid" x1="85" y1="430.0" x2="845" y2="430.0"/>
<text x="73" y="435.0" text-anchor="end" font-size="12">10^0</text>
<line class="grid" x1="85" y1="370.3" x2="845" y2="370.3"/>
<text x="73" y="375.3" text-anchor="end" font-size="12">10^1</text>
<line class="grid" x1="85" y1="310.6" x2="845" y2="310.6"/>
<text x="73" y="315.6" text-anchor="end" font-size="12">10^2</text>
<line class="grid" x1="85" y1="251.0" x2="845" y2="251.0"/>
<text x="73" y="256.0" text-anchor="end" font-size="12">10^3</text>
<line class="grid" x1="85" y1="191.3" x2="845" y2="191.3"/>
<text x="73" y="196.3" text-anchor="end" font-size="12">10^4</text>
<line class="grid" x1="85" y1="131.6" x2="845" y2="131.6"/>
<text x="73" y="136.6" text-anchor="end" font-size="12">10^5</text>
<line class="grid" x1="85" y1="71.9" x2="845" y2="71.9"/>
<text x="73" y="76.9" text-anchor="end" font-size="12">10^6</text>
<polyline class="line" stroke="#1f77b4" points="85.0,412.0 125.0,394.1 165.0,376.1 205.0,358.1 245.0,340.2 285.0,322.2 325.0,304.2 365.0,286.3 405.0,268.3 445.0,250.4 485.0,232.4 525.0,214.4 565.0,196.5 605.0,178.5 645.0,160.5 685.0,142.6 725.0,124.6 765.0,106.6 805.0,88.7 845.0,70.7"/>
<polyline class="line" stroke="#ff7f0e" points="85.0,412.0 125.0,394.1 165.0,376.1 205.0,358.1 245.0,340.2 285.0,322.3 325.0,305.1 365.0,290.1 405.0,278.6 445.0,270.3 485.0,264.4 525.0,260.1 565.0,256.9 605.0,254.4 645.0,252.2 685.0,250.3 725.0,248.6 765.0,247.0 805.0,245.6 845.0,244.2"/>
<line x1="545" y1="83" x2="580" y2="83" stroke="#1f77b4" stroke-width="3"/>
<text x="590" y="88" font-size="12">genealogical pedigree slots = 2^k</text>
<line x1="545" y1="106" x2="580" y2="106" stroke="#ff7f0e" stroke-width="3"/>
<text x="590" y="111" font-size="12">expected genetic ancestors</text>
<text x="85.0" y="454" text-anchor="middle" font-size="12">1</text>
<text x="205.0" y="454" text-anchor="middle" font-size="12">4</text>
<text x="365.0" y="454" text-anchor="middle" font-size="12">8</text>
<text x="525.0" y="454" text-anchor="middle" font-size="12">12</text>
<text x="685.0" y="454" text-anchor="middle" font-size="12">16</text>
<text x="845.0" y="454" text-anchor="middle" font-size="12">20</text>
<text x="465" y="480" text-anchor="middle" font-size="15">Generations back</text>
<text x="22" y="245" transform="rotate(-90 22 245)" text-anchor="middle" font-size="15">Count (log10 scale)</text>
<text x="450" y="508" text-anchor="middle" font-size="11">Expected genetic count = 2^k times the single-ancestor genetic-contribution probability; pedigree collapse is ignored.</text>
</svg>